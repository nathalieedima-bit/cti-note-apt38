title: Journal de sécurité Windows effacé
status: experimental
description: Détecte l'effacement du journal de sécurité, technique anti-forensique utilisée par APT38 après ses opérations.
references:
  - https://attack.mitre.org/groups/G0082/
author: Thérèse Nathalie Edima
date: 2026-09-24
tags:
  - attack.defense-evasion
logsource:
  product: windows
  service: security
detection:
  selection:
    EventID: 1102
  condition: selection
falsepositives:
  - Administrateur qui vide volontairement le journal
level: high
